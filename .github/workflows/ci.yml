name: CI

on:
  workflow_dispatch:
  push:
    branches:
    - master
    - main
    - features/**
    - fix/**
    tags:
    - '*.*.*'
  pull_request:

env:
  DOTNET_NOLOGO: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [macOS-latest, ubuntu-latest, windows-latest]
    name: ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - run: dotnet --info
    - run: dotnet tool restore
    
    - if: contains(matrix.runs-on, 'macOS') || contains(matrix.runs-on, 'ubuntu')
      run: ./build.sh
    - if: matrix.runs-on == 'windows-latest'
      run: ./build.ps1
    - name: Validate examples, dependencies and Windows SQL Server migrations
      shell: pwsh
      run: ./eng/Validate-Release.ps1
